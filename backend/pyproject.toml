[project]
name = "daybrief"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "Pillow>=11,<13"]
[project.optional-dependencies]
video = ["azure-cognitiveservices-speech>=1.42,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
[tool.pyright]
venvPath = ".."
venv = ".venv"

[tool.setuptools.package-data]
daybrief = ["assets/*.png", "assets/*.md"]
