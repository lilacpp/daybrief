name: daybrief
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DAYBRIEF_MODE: ${DAYBRIEF_MODE:-mock}
      DATABASE_URL: sqlite:////data/daybrief.db
      VIDEO_OUTPUT_DIR: /data/videos
      PROVIDER_CACHE_DIR: /data/cache
    volumes:
      - daybrief_data:/data
    restart: unless-stopped
    init: true
  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${DAYBRIEF_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  daybrief_data:
